name: Prepare route assets

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare-routes.mjs
      - .github/workflows/prepare-routes.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate provisional scenario with independent geography seed
        run: |
          node scripts/generate-calibrated-scenario.mjs \
            --profile src/scenario/calibration/amazon-last-mile-v1.json \
            --routes public/data/cordoba-calibrated-routes.geojson \
            --output /tmp/cordoba-provisional.json \
            --seed fleetflow-cordoba-v0.4
      - name: Prepare calibrated routes for new coordinates
        run: |
          node scripts/prepare-routes.mjs \
            --scenario /tmp/cordoba-provisional.json \
            --output public/data/cordoba-calibrated-routes.geojson
      - name: Generate final calibrated scenario against reconciled routes
        run: npm run generate:calibrated
      - name: Commit reconciled calibrated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cordoba-calibrated-routes.geojson
          git add src/scenario/generated/cordoba-calibrated-v1.json
          if git diff --cached --quiet; then
            echo "Calibrated data already matches the independent geography seed."
          else
            git commit -m "data: decouple calibrated geography seed"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-route-assets
          path: |
            public/data/cordoba-calibrated-routes.geojson
            src/scenario/generated/cordoba-calibrated-v1.json
          if-no-files-found: error
