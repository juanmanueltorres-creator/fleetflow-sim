name: Prepare route assets

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare-routes.mjs
      - .github/workflows/prepare-routes.yml

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run prepare:routes
      - run: npm run prepare:routes:calibrated
      - uses: actions/upload-artifact@v4
        with:
          name: coca-coqui-routes
          path: public/data/coca-coqui-routes.geojson
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cordoba-calibrated-routes
          path: public/data/cordoba-calibrated-routes.geojson
          if-no-files-found: error
