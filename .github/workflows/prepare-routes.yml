name: Prepare route assets

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare-routes.mjs
      - .github/workflows/prepare-routes.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:routes
      - run: npm run prepare:routes:calibrated
      - run: npm run generate:calibrated
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-route-assets
          path: |
            public/data/coca-coqui-routes.geojson
            public/data/cordoba-calibrated-routes.geojson
            src/scenario/generated/cordoba-calibrated-v1.json
          if-no-files-found: error
