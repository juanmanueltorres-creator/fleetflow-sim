name: Task 10 final verification

on:
  push:
    branches:
      - feat/v0.5-operational-timeline
    paths:
      - .github/workflows/task10-final-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Deterministic and offline generation gates
        run: |
          npm test -- --run \
            tests/calibratedScenario.test.ts \
            tests/provisionalGeneration.test.ts \
            tests/prepareRoutesWorkflow.test.ts \
            tests/operationalRunGenerator.test.ts \
            tests/operationalRunArtifacts.test.ts
      - name: Runtime and state gates
        run: |
          npm test -- --run \
            tests/operationalRunValidation.test.ts \
            tests/operationalRunCatalog.test.ts \
            tests/operationalRunCatalogSecurity.test.ts \
            tests/operationalDateRail.test.tsx \
            tests/operationalRunSwitching.test.tsx \
            tests/scenarioSwitching.test.tsx
      - name: Scope assertions
        run: |
          test "$(find public/data/operational-runs/generated -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 8
          ! grep -R '"mode": "OBSERVED"' public/data/operational-runs
          ! grep -R "operational-runs/generated" src
          grep -q '^  contents: read$' .github/workflows/prepare-routes.yml
