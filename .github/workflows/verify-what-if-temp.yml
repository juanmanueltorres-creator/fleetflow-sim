name: Verify What-If V0 Temp

on:
  push:
    branches:
      - feat/what-if-comparison-v0
    paths:
      - .github/workflows/verify-what-if-temp.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run focused acceptance suite
        run: >-
          npm test --
          tests/whatIfPublishedArtifacts.test.ts
          tests/whatIfComparisonLoader.test.ts
          tests/whatIfOutcomes.test.ts
          tests/whatIfUi.test.tsx
          tests/operationalRunSwitching.test.tsx
          tests/v06PublishedArtifacts.test.ts
      - name: Run full test suite
        run: npm test
      - name: Build production bundle
        run: npm run build
