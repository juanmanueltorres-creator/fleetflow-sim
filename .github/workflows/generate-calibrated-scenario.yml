name: Generate calibrated scenario

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-calibrated-scenario.mjs
      - src/scenario/calibration/amazon-last-mile-v1.json
      - public/data/cordoba-calibrated-routes.geojson
      - package.json
      - .github/workflows/generate-calibrated-scenario.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run generate:calibrated
      - uses: actions/upload-artifact@v4
        with:
          name: cordoba-calibrated-scenario
          path: src/scenario/generated/cordoba-calibrated-v1.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit canonical generated scenario
        run: |
          if git diff --quiet -- src/scenario/generated/cordoba-calibrated-v1.json; then
            echo "Canonical scenario already matches generator output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenario/generated/cordoba-calibrated-v1.json
          git commit -m "data: reconcile calibrated timings with Cordoba routes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
