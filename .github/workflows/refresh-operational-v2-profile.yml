name: Refresh operational v2 profile provenance

on:
  push:
    branches:
      - feat/v0.5-weekly-operational-profile
    paths:
      - .github/workflows/refresh-operational-v2-profile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate refreshed immutable v2 window
        run: |
          rm -rf /tmp/fleetflow-v2-runs
          node scripts/generate-operational-runs.mjs \
            --profile src/scenario/calibration/amazon-last-mile-v1.json \
            --routes public/data/cordoba-calibrated-routes.geojson \
            --from 2026-08-27 \
            --to 2026-09-03 \
            --issued-at 2026-08-30T21:00:00-03:00 \
            --data-as-of 2026-08-30T21:00:00-03:00 \
            --output-dir /tmp/fleetflow-v2-runs \
            --run-suffix v2
      - name: Publish refreshed v2 provenance
        run: |
          cp /tmp/fleetflow-v2-runs/manifest.json public/data/operational-runs/manifest.json
          cp /tmp/fleetflow-v2-runs/generated/*.json public/data/operational-runs/generated/
      - name: Commit refreshed v2 artifacts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/operational-runs/manifest.json public/data/operational-runs/generated/cordoba-*-v2.json
          git diff --cached --quiet && { echo "Expected v2 provenance changes"; exit 1; }
          git commit -m "data: freeze weekly profile metadata in v2"
          git push
