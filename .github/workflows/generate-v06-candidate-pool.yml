name: Generate V0.6 candidate pool

on:
  push:
    branches:
      - feat/v0.6-daily-spatial-demand
    paths:
      - .github/workflows/generate-v06-candidate-pool.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch municipal GTFS resources
        run: |
          set -euo pipefail
          url='https://gobiernoabierto.cordoba.gob.ar/api/datos-abiertos/dato/3319/version-dato/6122/recurso?format=json'
          curl --fail --location --silent --show-error "$url" --output /tmp/gtfs-resources.json
          test -s /tmp/gtfs-resources.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/gtfs-resources.json').read_text())
          print(json.dumps(data, indent=2, ensure_ascii=False)[:30000])
          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, item in value.items():
                      walk(item, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, f'{path}[{index}]')
              elif isinstance(value, str) and ('http://' in value or 'https://' in value or value.lower().endswith(('.zip', '.txt'))):
                  print('RESOURCE', path, '=', value)
          walk(data)
          PY
