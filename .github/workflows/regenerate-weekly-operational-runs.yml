name: Regenerate weekly operational runs

on:
  push:
    branches:
      - feat/v0.5-weekly-operational-profile
    paths:
      - .github/workflows/regenerate-weekly-operational-runs.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate immutable run window
        run: |
          rm -rf /tmp/fleetflow-weekly-runs
          node scripts/generate-operational-runs.mjs \
            --profile src/scenario/calibration/amazon-last-mile-v1.json \
            --routes public/data/cordoba-calibrated-routes.geojson \
            --from 2026-08-27 \
            --to 2026-09-03 \
            --issued-at 2026-08-30T21:00:00-03:00 \
            --data-as-of 2026-08-30T21:00:00-03:00 \
            --output-dir /tmp/fleetflow-weekly-runs \
            --run-suffix v1
      - name: Replace checked-in artifacts
        run: |
          cp /tmp/fleetflow-weekly-runs/manifest.json public/data/operational-runs/manifest.json
          cp /tmp/fleetflow-weekly-runs/generated/*.json public/data/operational-runs/generated/
      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/operational-runs
          git diff --cached --quiet && { echo "Expected regenerated artifact changes"; exit 1; }
          git commit -m "data: regenerate weekly operational runs"
          git push
