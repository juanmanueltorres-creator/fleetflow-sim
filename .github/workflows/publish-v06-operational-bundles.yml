name: Publish V0.6 operational bundles

on:
  push:
    branches:
      - feat/v0.6-daily-spatial-demand
    paths:
      - .github/workflows/publish-v06-operational-bundles.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate immutable V0.6 bundles
        run: |
          node scripts/generate-v0-6-operational-runs.mjs \
            --profile src/scenario/calibration/amazon-last-mile-v1.json \
            --candidate-pool src/scenario/operationalRuns/candidate-pool-v1.json \
            --fleet-template src/scenario/generated/cordoba-calibrated-v1.json \
            --from 2026-08-27 \
            --to 2026-09-03 \
            --issued-at 2026-08-30T21:00:00-03:00 \
            --data-as-of 2026-08-30T21:00:00-03:00 \
            --output-dir public/data/operational-runs \
            --manifest-name manifest-v0-6.json \
            --run-suffix v3
      - name: Verify publication shape
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('public/data/operational-runs/manifest-v0-6.json', 'utf8'))
          if (manifest.schemaVersion !== 2 || manifest.runs.length !== 8) {
            throw new Error('Expected schema V2 manifest with exactly 8 runs')
          }
          for (const entry of manifest.runs) {
            if (!entry.routeArtifact?.endsWith('.routes.geojson')) {
              throw new Error(`Missing route artifact for ${entry.id}`)
            }
            const run = JSON.parse(readFileSync(`public/data/operational-runs/${entry.artifact.slice(2)}`, 'utf8'))
            const routes = JSON.parse(readFileSync(`public/data/operational-runs/${entry.routeArtifact.slice(2)}`, 'utf8'))
            if (run.id !== entry.id || routes.metadata?.runId !== entry.id) {
              throw new Error(`Run/route binding mismatch for ${entry.id}`)
            }
            if (run.scenario.trucks.length !== 8 || run.scenario.stores.length < 45 || run.scenario.stores.length > 65) {
              throw new Error(`Invalid V0.6 operation shape for ${entry.id}`)
            }
          }
          NODE
      - name: Commit published bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/operational-runs/manifest-v0-6.json
          git add public/data/operational-runs/generated/*-v3.json
          git add public/data/operational-runs/generated/*-v3.routes.geojson
          git diff --cached --quiet && { echo "No V0.6 artifacts generated" >&2; exit 1; }
          git commit -m "data: publish v0.6 operational bundles"
          git push origin HEAD:feat/v0.6-daily-spatial-demand
