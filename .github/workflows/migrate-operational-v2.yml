name: Migrate operational vintage v2

on:
  push:
    branches:
      - feat/v0.5-weekly-operational-profile
    paths:
      - .github/workflows/migrate-operational-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore published v1 artifacts from main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-08-27-v1.json
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-08-28-v1.json
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-08-29-v1.json
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-08-30-v1.json
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-08-31-v1.json
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-09-01-v1.json
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-09-02-v1.json
          git checkout origin/main -- public/data/operational-runs/generated/cordoba-2026-09-03-v1.json
      - name: Generate v2 operational window
        run: |
          rm -rf /tmp/fleetflow-v2-runs
          node scripts/generate-operational-runs.mjs \
            --profile src/scenario/calibration/amazon-last-mile-v1.json \
            --routes public/data/cordoba-calibrated-routes.geojson \
            --from 2026-08-27 \
            --to 2026-09-03 \
            --issued-at 2026-08-30T21:00:00-03:00 \
            --data-as-of 2026-08-30T21:00:00-03:00 \
            --output-dir /tmp/fleetflow-v2-runs \
            --run-suffix v2
      - name: Publish v2 and update manifest
        run: |
          cp /tmp/fleetflow-v2-runs/manifest.json public/data/operational-runs/manifest.json
          cp /tmp/fleetflow-v2-runs/generated/*.json public/data/operational-runs/generated/
      - name: Commit immutable vintage migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/operational-runs
          git diff --cached --quiet && { echo "Expected vintage migration changes"; exit 1; }
          git commit -m "data: publish weekly operational vintage v2"
          git push
